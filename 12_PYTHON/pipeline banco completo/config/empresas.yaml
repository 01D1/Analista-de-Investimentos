# ═══════════════════════════════════════════════════════════════════════════════
# CADASTRO CENTRAL DE EMPRESAS — Intelligence System
# ═══════════════════════════════════════════════════════════════════════════════
#
# Este arquivo centraliza TODOS os tickers monitorados pelo pipeline.
# Cada empresa pertence a um setor, que define:
#   - Qual mapeamento de contas CVM usar (bank vs general)
#   - Qual motor de projeções usar (FCFE vs FCFF)
#   - Qual layout Excel usar
#   - Premissas default de valuation
#
# Para adicionar uma empresa nova:
#   1. Adicione a entrada abaixo no setor correto
#   2. Rode: python main.py --ticker XXXX3
#   O pipeline detecta o tipo e aplica o fluxo correto automaticamente.
#
# Hierarquia de premissas: empresa > setor > global (settings.py)
# ═══════════════════════════════════════════════════════════════════════════════

# ── Premissas globais (aplicadas quando setor/empresa não define) ────────────
defaults:
  anos_historicos: [2020, 2021, 2022, 2023, 2024, 2025]  # expandido dinamicamente até 2026 via ITR
  anos_projecao: [2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035]
  trimestre_atual: "4T25"  # atualizado dinamicamente pelo settings.py
  beta: 1.00
  premio_risco: 0.065        # ERP Brasil — Damodaran ajustado
  g_perpetuidade: 0.055      # PIB nominal LP (IPCA ~4.5% + real ~1%)
  payout: 0.40
  ir_aliquota_nominal: 0.34  # IR 25% + CSLL 9%
  divisor_valores: 1000      # CVM reporta em R$ mil → dividir p/ MM
  cache_ttl_horas: 24

# ═══════════════════════════════════════════════════════════════════════════════
# SETORES — Premissas default por setor
# ═══════════════════════════════════════════════════════════════════════════════

setores:

  # ── BANCOS ─────────────────────────────────────────────────────────────────
  bancos:
    tipo_empresa: bank             # usa mapeamento_contas.py (COSIF/bancário)
    motor_projecao: fcfe           # FCFE = Lucro × Payout
    motor_valuation: ke            # Ke (sem WACC — bancos não têm dívida "normal")
    template: null
    premissas:
      nim_alvo: 0.055
      pcld_pct_alvo: 0.035
      basileia_alvo: 0.135
      capex_pct_ativo: 0.0015
      payout: 0.45
      g_perpetuidade: 0.055
      beta: 0.90
      crescimento_receita:  # crescimento carteira crédito
        default: 0.07
      crescimento_servicos:
        default: 0.065

  # ── ENERGIA ────────────────────────────────────────────────────────────────
  energia:
    tipo_empresa: general
    motor_projecao: fcff
    motor_valuation: wacc
    template: null  # usar layout interno do pipeline
    premissas:
      margem_ebitda_alvo: 0.65   # utilities têm margem alta
      capex_pct_receita: 0.25    # setor capital-intensive
      ncg_pct_receita: 0.05
      depreciacao_pct_imobilizado: 0.04
      payout: 0.70               # utilities pagam dividendo alto
      g_perpetuidade: 0.050
      beta: 0.70
      crescimento_receita:
        default: 0.06            # reajuste inflação + expansão

  # ── INDUSTRIAL ─────────────────────────────────────────────────────────────
  industrial:
    tipo_empresa: general
    motor_projecao: fcff
    motor_valuation: wacc
    template: null
    premissas:
      margem_ebitda_alvo: 0.22
      capex_pct_receita: 0.06
      ncg_pct_receita: 0.15
      depreciacao_pct_imobilizado: 0.07
      payout: 0.50
      g_perpetuidade: 0.055
      beta: 1.00
      crescimento_receita:
        default: 0.08

  # ── PAPEL E CELULOSE ───────────────────────────────────────────────────────
  papel_celulose:
    tipo_empresa: general
    motor_projecao: fcff
    motor_valuation: wacc
    template: null
    premissas:
      margem_ebitda_alvo: 0.45   # exportadoras, margem alta em ciclo de alta
      capex_pct_receita: 0.20
      ncg_pct_receita: 0.08
      depreciacao_pct_imobilizado: 0.05
      payout: 0.35
      g_perpetuidade: 0.050
      beta: 1.10
      crescimento_receita:
        default: 0.07

  # ── LOGÍSTICA ──────────────────────────────────────────────────────────────
  logistica:
    tipo_empresa: general
    motor_projecao: fcff
    motor_valuation: wacc
    template: null
    premissas:
      margem_ebitda_alvo: 0.20
      capex_pct_receita: 0.15
      ncg_pct_receita: 0.10
      depreciacao_pct_imobilizado: 0.06
      payout: 0.25
      g_perpetuidade: 0.055
      beta: 1.15
      crescimento_receita:
        default: 0.08

  # ── CONSTRUÇÃO CIVIL ───────────────────────────────────────────────────────
  construcao_civil:
    tipo_empresa: general
    motor_projecao: fcff
    motor_valuation: wacc
    template: null
    premissas:
      margem_ebitda_alvo: 0.18
      capex_pct_receita: 0.03    # asset-light (terreno = estoque)
      ncg_pct_receita: 0.30      # capital de giro alto (estoque terrenos)
      depreciacao_pct_imobilizado: 0.05
      payout: 0.30
      g_perpetuidade: 0.055
      beta: 1.20
      crescimento_receita:
        default: 0.08

  # ── CONSUMO E VAREJO ───────────────────────────────────────────────────────
  consumo_varejo:
    tipo_empresa: general
    motor_projecao: fcff
    motor_valuation: wacc
    template: null
