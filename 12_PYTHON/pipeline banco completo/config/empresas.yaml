      ncg_pct_receita: 0.10
      depreciacao_pct_imobilizado: 0.10
      payout: 0.30
      g_perpetuidade: 0.055
      beta: 1.20
      crescimento_receita:
        default: 0.08

  # ── AGRO ───────────────────────────────────────────────────────────────────
