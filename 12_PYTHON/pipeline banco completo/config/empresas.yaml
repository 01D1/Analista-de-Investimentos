      margem_ebitda_alvo: 0.35
      capex_pct_receita: 0.10
      ncg_pct_receita: 0.15
      depreciacao_pct_imobilizado: 0.05
      payout: 0.35
      g_perpetuidade: 0.055
      beta: 1.00
      crescimento_receita:
        default: 0.07

  # ── SANEAMENTO ─────────────────────────────────────────────────────────────
  saneamento:
    tipo_empresa: general
    motor_projecao: fcff
    motor_valuation: wacc
    template: null
    premissas:
      margem_ebitda_alvo: 0.50
      capex_pct_receita: 0.35   # muito capital-intensive (infra)
      ncg_pct_receita: 0.05
      depreciacao_pct_imobilizado: 0.03
      payout: 0.50
      g_perpetuidade: 0.050
      beta: 0.70
      crescimento_receita:
        default: 0.07

  # ── TELECOM ────────────────────────────────────────────────────────────────
  telecom:
    tipo_empresa: general
    motor_projecao: fcff
    motor_valuation: wacc
    template: null
    premissas:
      margem_ebitda_alvo: 0.42
      capex_pct_receita: 0.18
      ncg_pct_receita: 0.05
      depreciacao_pct_imobilizado: 0.08
      payout: 0.60
      g_perpetuidade: 0.050
      beta: 0.75
      crescimento_receita:
        default: 0.05

  # ── SAÚDE ──────────────────────────────────────────────────────────────────
  saude:
    tipo_empresa: general
    motor_projecao: fcff
    motor_valuation: wacc
    template: null
    premissas:
      margem_ebitda_alvo: 0.22
      capex_pct_receita: 0.06
      ncg_pct_receita: 0.12
