    motor_projecao: fcff
    motor_valuation: wacc
    template: null
    premissas:
      margem_ebitda_alvo: 0.55   # margem alta (EBITDA inclui depreciação frota)
      capex_pct_receita: 0.60    # compra de frota = CAPEX alto
      ncg_pct_receita: 0.05
      depreciacao_pct_imobilizado: 0.15  # depreciação acelerada da frota
