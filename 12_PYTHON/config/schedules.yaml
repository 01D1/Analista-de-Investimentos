schedules:
  # ── Diários ───────────────────────────────────────────────
  - job: news_fetcher
    cron: "0 6 * * 1-5"       # seg–sex 06:00
    description: Coletar notícias overnight

  - job: morning_call
    cron: "30 6 * * 1-5"      # seg–sex 06:30
    description: Gerar morning call

  - job: b3_prices
    cron: "0 19 * * 1-5"      # seg–sex 19:00 (pós-fechamento B3)
    description: Atualizar preços OHLCV em ingestion.db

  # cvm_check removed — superseded by cvm_ingest (ING-01/02/03)

  - job: pipeline
    cron: "30 19 * * 1-5"     # seg–sex 19:30
    description: Processar dados novos se houver

  - job: analyze
    cron: "0 20 * * 1-5"      # seg–sex 20:00
    description: Recalcular métricas se dados novos

  - job: content
    cron: "30 20 * * 1-5"     # seg–sex 20:30
    description: Gerar posts/teses se análise nova

  - job: health_check
    cron: "0 * * * *"         # a cada hora
    description: Verificar saúde do sistema

  # ── Ingestão de dados ────────────────────────────────────
  - job: bcb_macro
    cron: "0 8 * * 1-5"       # seg–sex 08:00
    description: Ingestão séries macro BCB SGS (Selic, IPCA, PTAX, CDS Brasil, PIB)

  - job: news_ingest
    cron: "0 7 * * 1-5"       # seg–sex 07:00
    description: Coleta notícias (news_hunter) + sincronizar para ingestion.db

  - job: cvm_ingest
    cron: "15 19 * * 1-5"     # seg–sex 19:15 (staggered 15 min after b3_prices)
    description: Ingestão CVM DFP/ITR/IPE para watchlist

  - job: financial_engine
    cron: "0 20 * * 1-5"      # seg–sex 20:00 (após cvm_ingest + b3_prices)
    description: Calcular LTM, múltiplos, DCF e sinais técnicos para watchlist

  # ── Semanais ──────────────────────────────────────────────
  - job: weekly_review
    cron: "0 10 * * 0"        # domingo 10:00
    description: Gerar resumo semanal
