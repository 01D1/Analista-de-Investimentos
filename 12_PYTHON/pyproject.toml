[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intelligence-system"
version = "0.1.0"
description = "Sistema autônomo de inteligência financeira"
requires-python = ">=3.10"

dependencies = [
    # Core
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",

    # Ingestion
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "yfinance>=0.2.0",
    "pandas-market-calendars>=4.3.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",

    # Parsing
    "pdfplumber>=0.10.0",
    "openpyxl>=3.1.0",

    # Storage
    "supabase>=2.0.0",
    "pyarrow>=14.0.0",
    "duckdb>=0.10.0",

    # Scheduling
    "apscheduler>=3.10.0",

    # AI / Content
    "anthropic>=0.39.0",
    "instructor>=1.0.0",    # structured LLM output (latest: 1.15.1) — INT-01
    "jinja2>=3.1.0",        # prompt template rendering — INT-01

    # Delivery
    "python-telegram-bot>=21.0.0",

    # Observability
    "loguru>=0.7.0",
    "rich>=13.0.0",

    # Config parsing
    "pyyaml>=6.0.0",
]

[project.scripts]
intelligence = "src.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
dashboard = [
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src", "config", "news_hunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
